submission:
  title: "Mission Readiness & Predictive Maintenance Copilot"

  problem_statement: >
    Critical assets can fail unexpectedly, affecting mission readiness.
    Maintenance teams often rely on reactive decisions, while incomplete,
    noisy, or unreliable sensor data makes it difficult to identify which
    assets need attention and why.

  solution_summary: >
    Mission Readiness & Predictive Maintenance Copilot is an AI-powered
    platform that monitors asset health and sensor data to detect anomalies,
    predict failure risk, estimate Remaining Useful Life (RUL), and
    prioritize maintenance.

  key_features:
    - "Asset health monitoring"
    - "Failure risk prediction"
    - "Remaining Useful Life (RUL) estimation"
    - "Maintenance priority recommendations"
    - "Sensor quality and audit monitoring"

  tech_stack:
    languages: ["Python", "Node.js"]
    frameworks: ["FastAPI"]
    ibm_technologies: ["IBM Bob"]
    databases: []
    other: ["Docker"]

  what_we_are_most_proud_of: >
    The integration of predictive maintenance with real-world asset
    monitoring, demonstrated through ROBOT-001 using live IR sensor data
    from an Arduino and Python data bridge.

  known_limitations: >
    The current prototype runs locally and is intended as a hackathon
    demonstration rather than a production-scale deployment.

